<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Asistan Nöbet</title>
<link rel="stylesheet" href="teknesyum-ui/css/theme.css">
<link rel="stylesheet" href="teknesyum-ui/css/a11y.css">
<link rel="stylesheet" href="teknesyum-ui/css/forms.css">
<link rel="stylesheet" href="teknesyum-ui/css/states.css">
<link rel="stylesheet" href="teknesyum-ui/ustcubuk/titlebar.css">
<link rel="stylesheet" href="teknesyum-ui/durum/badge.css">
<link rel="stylesheet" href="app.css">
</head>
<body>

<div class="cerceve" id="cerceve">

<header class="tk-titlebar" id="basbar">
  <div class="tk-titlebar__brand">
    <span class="tk-titlebar__name">Asistan <span class="tk-titlebar__accent">Nöbet</span></span>
    <span class="basbar-surum" id="basbarSurum"></span>
    <span class="basbar-ay" id="basbarAy"></span>
  </div>
  <div class="tk-titlebar__tabs"></div>
  <div class="tk-titlebar__tools">
    <button type="button" class="tk-sync" id="basbarSenk" hidden></button>
    <button type="button" class="tk-titlebar__chip" id="btnSayfaQr" title="Açık sekmeyi resim olarak yükler, telefonla okutulacak QR gösterir">QR</button>
    <button type="button" class="tk-titlebar__chip" id="imza" title="Teknesyum — GitHub sayfamız">Teknesyum</button>
    <div class="tk-titlebar__window" id="pGrup">
      <button type="button" class="tk-titlebar__control" id="pKucult" aria-label="Küçült" title="Küçült"><span class="tk-titlebar__minimize" aria-hidden="true"></span></button>
      <button type="button" class="tk-titlebar__control" id="pBuyult" aria-label="Büyüt" title="Büyüt"><span class="tk-titlebar__maximize" aria-hidden="true"></span></button>
      <button type="button" class="tk-titlebar__control tk-titlebar__control--close" id="pKapat" aria-label="Kapat" title="Kapat"><span class="tk-titlebar__close" aria-hidden="true"></span></button>
    </div>
  </div>
</header>

<div class="kabuk">

<header class="ust">
  <nav class="adimlar" id="adimlar" role="tablist" aria-label="Aşamalar"></nav>
  <span class="bosluk"></span>
  <label class="tk-sr-only" for="ay">Ay</label>
  <input id="ay" class="gir gir-orta" type="month">
  <button type="button" id="btnCoz" class="dgm dgm-birincil">Listeyi Oluştur</button>
  <button id="btnKurallar" class="dgm" type="button">Kurallar</button>
  <button id="btnKaydet" class="dgm" type="button">Kaydet</button>
  <button id="btnYukle" class="dgm" type="button">Yükle</button>
  <input id="fileIn" type="file" accept=".json" hidden>
</header>

<main class="govde" id="govde">

<section id="s-kadro" role="tabpanel" hidden>
  <div class="kadro">
    <div class="pnl">
      <div class="pnl-bas"><span id="kadroEkle" class="satir"></span><span class="bosluk"></span><span id="kadroYardim"></span></div>
      <div class="pnl-icerik" id="asistanIc"></div>
    </div>
    <div class="ayirac ayirac-dikey" data-ayirac="kadro"></div>
    <div class="kadro-sag">
      <div class="kadro-ay">
        <div class="pnl">
          <div class="pnl-bas"><span class="bosluk"></span><span id="ayYardim"></span></div>
          <div class="pnl-icerik" id="ayIc"></div>
        </div>
        <div class="ayirac ayirac-dikey" data-ayirac="kadroAy"></div>
        <div class="pnl">
          <div class="pnl-bas" id="gunBas">Gün</div>
          <div class="pnl-icerik" id="gunIc"></div>
        </div>
      </div>
      <div class="ayirac ayirac-yatay" data-ayirac="kadroSag"></div>
      <div class="pnl">
        <div class="pnl-bas"><span class="bosluk"></span><span id="istekYardim"></span></div>
        <div class="pnl-icerik" id="istekIc"></div>
      </div>
    </div>
  </div>
</section>

<section id="s-liste" role="tabpanel" hidden>
  <div class="liste-duzen">
    <div class="pnl">
      <div class="pnl-icerik" id="listeIc"></div>
    </div>
    <div class="ayirac ayirac-dikey" data-ayirac="liste1"></div>
    <div class="pnl">
      <div class="pnl-bas" id="ortaBas"><span>Durum</span></div>
      <div class="pnl-icerik" id="durumIc"></div>
    </div>
    <div class="ayirac ayirac-dikey" data-ayirac="liste2"></div>
    <div class="pnl">
      <div class="pnl-bas"><span class="bosluk"></span><span id="dengeYardim"></span></div>
      <div class="pnl-icerik" id="dengeIc"></div>
    </div>
  </div>
</section>

<section id="s-cikti" role="tabpanel" hidden>
  <div class="cikti-duzen">
    <div class="pnl">
      <div class="pnl-bas"><span class="bosluk"></span>
        <button id="btnKopyaTablo" class="dgm dgm-mini" type="button">Excel'e Kopyala</button>
        <button id="btnKopyaCsv" class="dgm dgm-mini" type="button">CSV Kopyala</button></div>
      <div class="pnl-icerik" id="ciktiIc"></div>
    </div>
  </div>
</section>

</main>
</div>
</div>

<div class="perde" id="perde" data-acik="0"></div>
<aside class="cekmece" id="cekmece" data-acik="0" aria-label="Kurallar">
  <div class="cekmece-bas"><span>Kurallar</span><span class="bosluk"></span>
    <button id="btnKuralKapat" class="dgm dgm-mini" type="button">Kapat</button></div>
  <div class="cekmece-ic" id="kuralIc"></div>
</aside>

<div class="bildirim" id="toast" role="status" aria-live="polite"></div>
<dialog id="telDlg" class="tel-dlg" aria-labelledby="telBas">
  <div class="pnl-bas"><span id="telBas">Telefona Aktar</span><span class="bosluk"></span><button type="button" id="telKapat" class="dgm dgm-mini">Kapat</button></div>
  <canvas id="telQr" class="tel-qr"></canvas>
  <ol class="tel-adim">
    <li>Telefon kamerasıyla QR'ı okut, resim açılır.</li>
    <li>Resme uzun bas → Paylaş → WhatsApp.</li>
    <li>Resim 3 saat sonra sunucudan silinir.</li>
  </ol>
  <button type="button" id="telLink" class="tel-link" title="Bağlantıyı kopyala"></button>
</dialog>
<script src="qr.js"></script>
<script>
((window.pencere && window.pencere.veri.hazir) ? window.pencere.veri.hazir() : Promise.resolve()).then(() => {
  const s = document.createElement("script");
  s.src = "uygulama.js";
  document.body.append(s);
});
</script>
</body>
</html>
